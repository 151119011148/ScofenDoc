server:
  # 生产由 systemd 传 SERVER_PORT=8081（8080 已被同机另一个服务占用）
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # 请求体超过 multipart 上限时，Tomcat 默认只吞 2MB 就断连，浏览器只会显示「连接被重置」，
    # 看不到我们返回的 413 文案。放宽到和 max-request-size 一致，让用户能收到明确提示。
    max-swallow-size: 520MB

spring:
  application:
    name: scofen-doc-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scofen_doc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USER:scofendoc}
    password: ${DB_PASSWORD:scofendoc}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 小内存机器（2C1.8G）限制连接数，避免把 MySQL 连接打满
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    hibernate:
      # 表结构交给 Flyway 版本化迁移（db/migration/*.sql），JPA 只做校验
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      # 上限取附件的值（默认 500MB）：图片 10MB 由 ImageController 自己校验，
      # 附件由 AttachmentController 按 scofendoc.attachments.max-size-mb 校验。
      # 这里必须 >= 两者的最大校验值，否则大附件在进 Controller 前就被容器拒掉。
      # 注意还有第三层：Nginx 的 client_max_body_size 也要同步放开。
      max-file-size: 500MB
      max-request-size: 520MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 线上已有库（非空 schema 且无 flyway 历史表）时自动 baseline 到 V1，
    # 跳过 V1 建表、直接执行 V1 之后的数据迁移；全新空库则从 V1 开始建表。
    baseline-on-migrate: true
    baseline-version: 1

logging:
  file:
    name: ${LOG_FILE:/opt/scofendoc/logs/backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    root: INFO

scofendoc:
  # 注册策略：closed（默认，仅管理员开号）| open（允许自助注册）
  # 例外：库里一个账号都没有时永远允许注册，第一个注册者自动成为管理员，
  # 否则新实例关闭注册后就没人能进系统了。
  auth:
    registration-mode: ${REGISTRATION_MODE:closed}
  jwt:
    # 签名密钥。生产必须在 backend.env + collab.env 里配成同一个随机串，
    # Java 与 Node 都对它做一次 SHA-256 得到 HS256 密钥，长度不限但务必一致。
    secret: ${JWT_SECRET:scofendoc-dev-only-secret-change-me}
    # 登录态有效期：7 天
    ttl-seconds: ${JWT_TTL_SECONDS:604800}
    # 协同 token 有效期：2 小时（前端每次切文档重新申请）
    collab-ttl-seconds: ${JWT_COLLAB_TTL_SECONDS:7200}
  # 正文全文检索由协同服务提供（它能解析 Yjs .bin）。只绑回环、不走 Nginx。
  # 协同服务不可用时搜索自动降级为标题匹配，不影响主流程。
  collab:
    search-url: ${COLLAB_SEARCH_URL:http://127.0.0.1:1235/internal/search}
  # 正文粘贴/拖入的图片：落盘目录与 Nginx 的 /scofendoc/files/ alias 必须一致
  files:
    dir: ${SCOFENDOC_FILES_DIR:/var/www/scofendoc-files}
    url-prefix: ${SCOFENDOC_FILES_URL_PREFIX:/scofendoc/files/}
  # 正文附件：独立目录，不放 Nginx 静态映射下，只能经 /api/attachments/{id}/download 鉴权取回
  attachments:
    dir: ${SCOFENDOC_ATTACHMENTS_DIR:/var/lib/scofendoc/attachments}
    # 单个附件上限（MB）。改动时必须同步：spring.servlet.multipart.*、Nginx client_max_body_size
    max-size-mb: ${SCOFENDOC_ATTACHMENT_MAX_MB:500}

