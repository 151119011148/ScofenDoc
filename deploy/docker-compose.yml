services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: light_doc
      MYSQL_USER: lightdoc
      MYSQL_PASSWORD: lightdoc
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  collab:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.collab
    ports:
      - "1234:1234"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - collab

volumes:
  mysql_data:
